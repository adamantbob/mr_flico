name: Render KiCad PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render-pdfs:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --no-cache-dir --break-system-packages -r scripts/requirements.txt

      - name: Render schematics, composite PCB, and 3D views
        run: |
          REV=$(printf '%.7s' "$GITHUB_SHA")
          python3 scripts/render_pdfs.py \
            --include-inner \
            --rev "$REV" \
            --output build/pdfs/mike_rocket_docs.pdf

      - name: Upload combined PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: mike_rocket-docs-pdf
          path: build/pdfs/mike_rocket_docs.pdf
          if-no-files-found: error
